<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        #snackbar {
            visibility: hidden;
            min-width: 280px;
            background-color: #27273A;
            color: #0066FF;
            text-align: center;
            border-radius: 12px;
            padding: 16px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1055;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #snackbar.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow">
            <div class="text-center mb-4">
                <div class="login-logo mb-2">
                    <img src="logoclinicavida.png" alt="Logo Clínica Vida" class="logo-img">
                    <div class="login-url">www.clinicavidaonline.com.br</div>
                </div>
            </div>
            <h3 class="text-center login-heading mb-4">Login</h3>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label login-label">Email</label>
                    <input type="email" class="form-control login-input" id="email" placeholder="Email">
                </div>
                <div class="mb-1">
                    <label for="senha" class="form-label login-label">Senha</label>
                    <input type="password" class="form-control login-input" id="senha" placeholder="Senha">
                </div>
                <div class="d-flex justify-content-end mb-3">
                    <a href="#" class="login-link">Esqueceu sua Senha?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                <button type="button" onclick="openModal()"
                    class="btn btn-superid mb-3 d-flex align-items-center justify-content-center mx-auto">
                    <span class="superid-text flex-grow-1 text-center">Entrar com SuperID</span>
                    <img src="logo.png" alt="SuperID Logo" class="superid-img ms-2">
                </button>
            </form>
            <div class="text-center mt-3">
                <span class="login-register-text">Ainda não tem conta? <a href="#" class="login-link">Registre-se
                        agora</a></span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="superIDModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header">
                    <h5 class="modal-title" id="superIdModalLabel">Login com SuperID</h5>
                    <button onclick="closeModal()" type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <p>Escaneie o QR Code com o app SuperID</p>
                    <img id="qrcode" src="https://placehold.co/192x192/27273A/0066FF?text=QR+Code"
                        alt="QR Code carregando..." class="img-fluid mb-3" />
                    <div id="status">Aguardando escaneamento...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="snackbar"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
